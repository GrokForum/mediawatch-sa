# RFC-CHG-MW-002 option A: build the static site from main and deploy it to
# GitHub Pages (custom domain mediawatch.grokforum.site, set in Pages settings).
# Indexing stays off: robots.txt is Disallow-all and every page is noindex.
# RFC-CHG-MW-003: also runs nightly and records a post-deploy live check
# (artifact only; this workflow never has contents: write).
name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:30 Africa/Johannesburg (SAST, UTC+2; South Africa has no DST).
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py --out _site
      - run: python -m pytest -q
      - name: Check no indexing
        run: |
          set -eu
          printf 'User-agent: *\nDisallow: /\n' | cmp - _site/robots.txt
          total=$(find _site -name '*.html' | wc -l)
          tagged=$(grep -rl --include='*.html' '<meta name="robots" content="noindex, nofollow">' _site | wc -l)
          echo "html=$total noindex=$tagged"
          test "$total" -gt 0 && test "$total" -eq "$tagged"
      - name: Check only allowed file types
        run: |
          set -eu
          bad=$(find _site ! -type d \( ! -type f -o \( ! -name '*.html' ! -name '*.css' ! -path '_site/robots.txt' \) \))
          if [ -n "$bad" ]; then echo "Unexpected files in _site:"; echo "$bad"; exit 1; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  live_check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # upload-artifact uses the runner ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Live check
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/check_live.py \
            --base-url https://mediawatch.grokforum.site \
            --out live-check.json \
            --sha "$GIT_SHA" \
            --run-id "$RUN_ID" \
            --event "$EVENT_NAME" \
            --wait 300
      - name: Record result in the job summary
        if: always()
        run: |
          if [ -f live-check.json ]; then
            {
              echo '## Live check'
              echo
              echo '```json'
              cat live-check.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-check-${{ github.run_id }}
          path: live-check.json
          if-no-files-found: error
          retention-days: 90
